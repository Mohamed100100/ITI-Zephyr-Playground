# Demo app configuration (Kconfig assignments).
# Every line here becomes CONFIG_<NAME> in build/.config -> autoconf.h.

# --- Zephyr subsystems we use ---
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- Our custom module (see d2v_module/Kconfig) ---
CONFIG_DIGITAL_TO_VOLT=y
CONFIG_DIGITAL_TO_VOLT_VREF_MV=3300
CONFIG_DIGITAL_TO_VOLT_RESOLUTION_BITS=12
