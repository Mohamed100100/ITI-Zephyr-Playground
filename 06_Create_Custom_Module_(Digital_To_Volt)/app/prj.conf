# Demo app configuration (Kconfig assignments).
# Every line here becomes CONFIG_<NAME> in build/.config -> autoconf.h.

# --- Zephyr subsystems we use ---
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- Our custom module ---
CONFIG_DIGITAL_TO_VOLT=y
CONFIG_D2V_VREF_MV=3300
CONFIG_D2V_RESOLUTION=12
CONFIG_D2V_LED_THRESHOLD_MV=1650

# Simulate on native_sim/QEMU (no ADC hardware there).
# On the Black Pill with the boards/*.overlay below, set =n to read PA1.
CONFIG_D2V_SIMULATE=y
